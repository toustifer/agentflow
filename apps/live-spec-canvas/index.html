<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agentflow Live-Spec Canvas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .theme-dark {
      --bg: #09090b;
      --card: #18181b;
      --card-hover: #27272a;
      --border: #27272a;
      --border-subtle: #3f3f46;
      --text: #f4f4f5;
      --subtext: #a1a1aa;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --critical: #f97316;
      --cycle-alert: #ef4444;
      --success: #22c55e;
      --panel-bg: #121215;
    }
    .theme-light {
      --bg: #f8fafc;
      --card: #ffffff;
      --card-hover: #f1f5f9;
      --border: #e2e8f0;
      --border-subtle: #cbd5e1;
      --text: #0f172a;
      --subtext: #64748b;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --critical: #ea580c;
      --cycle-alert: #dc2626;
      --success: #16a34a;
      --panel-bg: #ffffff;
    }
  </style>
</head>
<body class="theme-dark">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
